<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>English Game</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 background-color: #1a1a2e;
 color: white;
 margin: 0;
 padding: 0;
 padding-top: 60px;
 text-align: center;
 overflow-x: hidden;
 }
 
 /* --- HOVER / TOUCH SETTINGS PANEL --- */
 .hover-menu {
 position: fixed; top: 0; left: 50%; transform: translateX(-50%);
 width: 100%; max-width: 950px; background-color: #16213e;
 border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
 box-shadow: 0 10px 25px rgba(0,0,0,0.8); z-index: 1000; transition: all 0.3s ease;
 }
 .hover-trigger {
 padding: 15px; text-align: center; font-weight: bold; font-size: 16px;
 cursor: pointer; color: #e94560; transition: color 0.3s, background-color 0.3s;
 border-bottom-left-radius: 15px; border-bottom-right-radius: 15px;
 }
 .hover-menu:hover .hover-trigger, .hover-menu.open .hover-trigger { color: white; background-color: #e94560; }
 .hover-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; padding: 0 20px; }
 .hover-menu:hover .hover-content, .hover-menu.open .hover-content { max-height: 500px; padding: 0 20px 20px 20px; overflow: visible; }
 
 .settings-panel { display: flex; justify-content: space-around; gap: 15px; align-items: flex-start; margin-top: 10px; }
 .color-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: left; font-size: 16px; margin-bottom: 10px; }
 .color-list label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
 .select-btns { display: flex; gap: 10px; }
 .select-btns button {
 padding: 5px 10px; font-size: 14px; cursor: pointer; background-color: #e94560;
 color: white; border: none; border-radius: 5px; font-weight: bold;
 }
 .dropdown-group { display: flex; flex-direction: column; gap: 12px; text-align: left; font-size: 14px; }
 .dropdown-group label { display: block; margin-bottom: 5px; font-weight: bold; }
 select { width: 100%; padding: 5px; font-size: 14px; border-radius: 5px; }
 
 /* --- TABS --- */
 .tabs { margin-top: 15px; margin-bottom: 25px; display: flex; justify-content: center; flex-wrap: nowrap; overflow-x: auto; padding: 0 10px; }
 .tab-btn {
 padding: 10px 12px; font-size: 14px; cursor: pointer; background-color: #533483;
 color: white; border: none; border-radius: 5px; margin: 0 3px; font-weight: bold; white-space: nowrap; transition: 0.3s;
 }
 .tab-btn.active { background-color: #e94560; }

 /* --- ОБЩИЕ БОКОВЫЕ КНОПКИ --- */
 .side-nav-btn {
 position: fixed; top: 50%; transform: translateY(-50%);
 background-color: #e94560; color: white;
 border: none; border-radius: 50%; cursor: pointer; font-weight: bold; 
 box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100;
 width: 80px; height: 80px; display: flex; justify-content: center; align-items: center;
 font-size: 30px; transition: 0.2s;
 }
 .side-nav-btn:hover { background-color: #c9344b; }
 .side-nav-btn:disabled { background-color: #7f8c8d; cursor: not-allowed; }
 .btn-prev-side { left: 20px; }
 .btn-next-side { right: 20px; }
 
 /* Спец. стиль для кнопок с текстом (Вкладка 4) */
 .side-text-btn { font-size: 16px; }

 /* --- TAB 1 (LEARN) --- */
 #tab1-content { display: none; flex-direction: column; align-items: center; position: relative; min-height: 80vh; justify-content: center; }
 .flashcard {
 background-color: #f5f5f5; padding: 15px; border-radius: 20px;
 width: 450px; height: 520px; display: flex; flex-direction: column; justify-content: center; align-items: center;
 box-shadow: 0 10px 25px rgba(0,0,0,0.6); margin: 0 auto;
 }
 .flashcard-img { width: 100%; height: 80%; object-fit: contain; margin-bottom: 15px; }
 .flashcard-text { font-size: 50px; font-weight: bold; color: #16213e; text-transform: uppercase; }

 /* --- TAB 2 (PAIRS) --- */
 #tab2-content { display: none; flex-direction: column; align-items: center; min-height: 80vh; }
 .game-board { display: grid; grid-template-columns: repeat(auto-fit, 160px); gap: 15px; justify-content: center; max-width: 1000px; margin: 20px auto; }
 .card { width: 160px; height: 160px; perspective: 1000px; cursor: pointer; }
 .card-inner { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
 .card.flipped .card-inner { transform: rotateY(180deg); }
 .card-front, .card-back {
 width: 100%; height: 100%; position: absolute; backface-visibility: hidden;
 border-radius: 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; box-sizing: border-box;
 }
 .card-front { background-color: #533483; color: white; font-size: 45px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
 .card-back { background-color: white; color: #16213e; transform: rotateY(180deg); font-size: 22px; flex-direction: column; text-transform: uppercase; padding: 10px; overflow: hidden; }
 .card-img-game { width: 100%; height: 100%; object-fit: contain; }
 .win-message { display: none; font-size: 36px; color: #e94560; margin-top: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
 .restart-btn { display: none; margin-top: 20px; margin-bottom: 40px; padding: 15px 30px; font-size: 20px; background-color: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

 /* --- TAB 3 (LISTEN & CHOOSE) --- */
 #tab3-content { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
 .listen-board { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; max-width: 1000px; margin: 0 auto 30px auto; width: 100%; }
 .listen-card {
 background-color: white; border-radius: 15px; width: 220px; height: 260px; display: flex; flex-direction: column;
 box-shadow: 0 5px 15px rgba(0,0,0,0.5); overflow: hidden; position: relative; border: 4px solid #533483; box-sizing: border-box;
 }
 .listen-letter { position: absolute; top: 8px; left: 10px; background-color: #16213e; color: white; font-size: 32px; font-weight: bold; padding: 4px 16px; border-radius: 8px; z-index: 10; }
 .listen-img-box { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; height: 100%; box-sizing: border-box; }
 .listen-img { width: 100%; height: 100%; object-fit: contain; }
 .listen-text { font-size: 24px; font-weight: bold; color: #16213e; margin-top: 5px; margin-bottom: 5px; text-transform: uppercase; }
 
 /* Кнопка Shuffle внизу по центру */
 .shuffle-btn {
 padding: 15px 40px; font-size: 20px; background-color: #533483; color: white;
 border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
 box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: 0.2s;
 }
 .shuffle-btn:hover { background-color: #3e2562; }

 /* --- TAB 4 (WHO IS FASTER) --- */
 #tab4-content { display: none; flex-direction: column; align-items: center; position: relative; min-height: 80vh; justify-content: center; }
 .faster-display {
 background-color: #16213e; border-radius: 15px; width: 100%; max-width: 650px; height: 500px;
 display: flex; flex-direction: column; justify-content: center; align-items: center;
 margin: 0 auto; box-shadow: 0 10px 20px rgba(0,0,0,0.7); overflow: hidden; border: 4px solid #533483;
 }
 .faster-img { width: 300px; height: 300px; object-fit: contain; border-radius: 15px; }

 /* --- TAB 5 (WORD BUILDER) - БЕЗ ИЗМЕНЕНИЙ --- */
 #tab5-content { display: none; flex-direction: column; align-items: center; position: relative; min-height: 80vh; justify-content: center; }
 .builder-container { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
 .image-container {
 position: relative; width: 350px; height: 350px; background-color: white;
 border-radius: 20px; padding: 15px; box-sizing: border-box;
 display: flex; justify-content: center; align-items: center;
 border: 4px solid #533483; margin-bottom: 30px;
 }
 .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
 .checkmark { position: absolute; top: -30px; right: -30px; font-size: 80px; color: #2ecc71; display: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
 .slots-container { display: flex; gap: 15px; margin-bottom: 40px; flex-wrap: wrap; justify-content: center; }
 .slot {
 width: 70px; height: 70px; background-color: #16213e; border: 4px solid #e94560;
 border-radius: 12px; display: flex; justify-content: center; align-items: center;
 font-size: 40px; font-weight: bold; color: white;
 }
 .slot.space { border: none; background-color: transparent; width: 25px; }
 .slot.filled { border-color: #2ecc71; color: #2ecc71; }
 .letters-pool { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; max-width: 800px; margin-bottom: 30px; }
 .letter-btn {
 width: 70px; height: 70px; background-color: #533483; border: 3px solid #9b59b6;
 border-radius: 12px; color: white; font-size: 40px; font-weight: bold; cursor: pointer;
 transition: all 0.2s; display: flex; justify-content: center; align-items: center;
 }
 .letter-btn:hover { background-color: #9b59b6; }
 .letter-btn.correct { background-color: #2ecc71; border-color: #2ecc71; pointer-events: none; }
 .letter-btn.wrong { background-color: #e74c3c; border-color: #e74c3c; }
 .letter-btn.hidden { visibility: hidden; }

 /* --- TAB 6 (WHAT'S MISSING) - БЕЗ ИЗМЕНЕНИЙ --- */
 #tab6-content { display: none; flex-direction: column; align-items: center; position: relative; min-height: 80vh; justify-content: center; }
 .missing-display {
 background-color: #16213e; border-radius: 15px; width: 100%; max-width: 900px; min-height: 500px;
 display: flex; flex-direction: column; justify-content: center; align-items: center;
 margin: 0 auto; box-shadow: 0 10px 20px rgba(0,0,0,0.7); border: 4px solid #533483; padding: 20px;
 box-sizing: border-box;
 }
 .missing-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; align-items: center; align-content: center; width: 100%; height: 100%; }
 .missing-card {
 background-color: white; border-radius: 15px; flex: 1 1 180px; max-width: 250px; min-height: 220px; 
 display: flex; flex-direction: column; justify-content: center; align-items: center; 
 border: 4px solid #533483; padding: 15px; box-sizing: border-box;
 }
 .missing-card img { width: 100%; height: 130px; object-fit: contain; }
 .missing-card span { font-size: 24px; font-weight: bold; color: #16213e; margin-top: 10px; text-transform: uppercase; }
 .missing-card.hidden-card { background-color: #1a1a2e; border-color: #e94560; color: #e94560; font-size: 60px; font-weight: bold; }
 .missing-card.revealed { border-color: #2ecc71; box-shadow: 0 0 20px #2ecc71; }
 .countdown-text { font-size: 150px; color: #e94560; font-weight: bold; margin: 0; }
 .question-text { font-size: 60px; color: #f1c40f; font-weight: bold; margin: 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

 /* --- TAB 7 (QUIZ) --- */
 #tab7-content { display: none; flex-direction: column; align-items: center; position: relative; min-height: 80vh; justify-content: center; }
 .quiz-container { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
 .quiz-image-container {
 width: 350px; height: 350px; background-color: white; border-radius: 20px; padding: 15px;
 box-sizing: border-box; display: flex; justify-content: center; align-items: center;
 border: 4px solid #533483; margin-bottom: 30px;
 }
 .quiz-image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
 .quiz-slots-container { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
 .quiz-slot {
 width: 70px; height: 80px; background-color: #16213e; border: 4px solid #533483;
 border-radius: 12px; display: flex; justify-content: center; align-items: center;
 font-size: 40px; font-weight: bold; color: white; text-transform: uppercase;
 }
 .quiz-slot.active { border-color: #3498db; box-shadow: 0 0 20px #3498db; }
 .quiz-slot.correct { border-color: #2ecc71; color: #2ecc71; }
 .quiz-slot.wrong { border-color: #e74c3c; background-color: #e74c3c; color: white; }
 .quiz-slot.space { border: none; background-color: transparent; width: 25px; }
 .hidden-input { position: absolute; opacity: 0; pointer-events: none; }
 </style>
</head>
<body>

 <!-- HOVER SETTINGS PANEL -->
 <div class="hover-menu" id="settingsMenu">
 <div class="hover-trigger" onclick="toggleMenu()">Tap / Hover for settings ⬇</div>
 <div class="hover-content" onclick="event.stopPropagation()">
 <div class="settings-panel">
 <div>
 <strong>1. Select words:</strong>
 <div class="color-list" id="color-checkboxes"></div>
 <div class="select-btns">
 <button onclick="selectAllColors()">Select All</button>
 <button onclick="deselectAllColors()">Clear All</button>
 </div>
 </div>
 <div class="dropdown-group">
 <div>
 <label>2. Difficulty (Main):</label>
 <select id="difficulty-level" onchange="applySettings()">
 <option value="1">Level 1 (Picture)</option>
 <option value="2" selected>Level 2 (Picture + Word)</option>
 <option value="3">Level 3 (Word)</option>
 </select>
 </div>
 <div>
 <label>3. Letters for Listen:</label>
 <select id="letter-mode" onchange="applySettings()">
 <option value="sequential">Sequential (A, B, C...)</option>
 <option value="random">Random (Z, Y, H...)</option>
 </select>
 </div>
 <div>
 <label>4. Numbers for Pairs:</label>
 <select id="card-number-mode" onchange="applySettings()">
 <option value="1">Start from 1</option>
 <option value="12">Start from 12</option>
 <option value="random">Random (12+)</option>
 </select>
 </div>
 <div>
 <label>5. Quiz Mode:</label>
 <select id="quiz-level" onchange="applySettings()">
 <option value="1">Level 1 (Vowels)</option>
 <option value="2" selected>Level 2 (Vowels + Consonants)</option>
 <option value="3">Level 3 (No hints)</option>
 </select>
 </div>
 </div>
 </div>
 </div>
 </div>

 <!-- TABS -->
 <div class="tabs">
 <button class="tab-btn active" onclick="switchTab(1)">Learn</button>
 <button class="tab-btn" onclick="switchTab(2)">Pairs</button>
 <button class="tab-btn" onclick="switchTab(3)">Listen</button>
 <button class="tab-btn" onclick="switchTab(4)">Faster</button>
 <button class="tab-btn" onclick="switchTab(5)">Builder</button>
 <button class="tab-btn" onclick="switchTab(6)">Missing</button>
 <button class="tab-btn" onclick="switchTab(7)">Quiz</button>
 </div>

 <!-- TAB 1 -->
 <div id="tab1-content">
 <button class="side-nav-btn btn-prev-side" onclick="prevFlashcard()">❮</button>
 <div class="flashcard">
 <img id="fc-img" class="flashcard-img" src="" alt="">
 <div class="flashcard-text" id="fc-text"></div>
 </div>
 <button class="side-nav-btn btn-next-side" onclick="nextFlashcard()">❯</button>
 </div>

 <!-- TAB 2 -->
 <div id="tab2-content">
 <div class="game-board" id="game-board"></div>
 <div class="win-message" id="win-message"> Great job! You found all the pairs! </div>
 <button class="restart-btn" id="restart-btn" onclick="startGame()">Play Again</button>
 </div>

 <!-- TAB 3 -->
 <div id="tab3-content">
 <div class="listen-board" id="listen-board"></div>
 <button class="shuffle-btn" onclick="initListenBoard()">Shuffle</button>
 </div>

 <!-- TAB 4 -->
 <div id="tab4-content">
 <button id="faster-start-btn" class="side-nav-btn btn-prev-side side-text-btn" onclick="startFasterGame()">Start</button>
 <div class="faster-display" id="faster-display">
 <h1 style="color: #bdc3c7;">Press Start</h1>
 </div>
 <button id="faster-pause-btn" class="side-nav-btn btn-next-side side-text-btn" onclick="togglePauseFasterGame()" disabled>Pause</button>
 </div>

 <!-- TAB 5 -->
 <div id="tab5-content">
 <button class="side-nav-btn btn-prev-side" onclick="prevBuilderWord()">❮</button>
 <div class="builder-container">
 <div class="image-container">
 <div class="checkmark" id="builder-checkmark"> </div>
 <img id="builder-image" src="" alt="Word Image">
 </div>
 <div class="slots-container" id="builder-slots"></div>
 <div class="letters-pool" id="builder-letters"></div>
 </div>
 <button class="side-nav-btn btn-next-side" onclick="nextBuilderWord()">❯</button>
 </div>

 <!-- TAB 6 -->
 <div id="tab6-content">
 <button id="missing-start-btn" class="side-nav-btn btn-prev-side side-text-btn" onclick="startMissingGame()" style="font-size: 18px; font-weight: bold;">Start</button>
 <div class="missing-display" id="missing-display">
 <h1 style="color: #bdc3c7;">Press Start</h1>
 </div>
 <button id="missing-pause-btn" class="side-nav-btn btn-next-side" onclick="togglePauseMissingGame()" disabled style="font-size: 25px;"> </button>
 </div>

 <!-- TAB 7 -->
 <div id="tab7-content">
 <button class="side-nav-btn btn-prev-side" onclick="prevQuizWord()">❮</button>
 <div class="quiz-container">
 <div class="quiz-image-container">
 <img id="quiz-image" src="" alt="Word Image">
 </div>
 <div class="quiz-slots-container" id="quiz-slots"></div>
 <input type="text" id="hidden-input" class="hidden-input" autocomplete="off">
 </div>
 <button class="side-nav-btn btn-next-side" onclick="nextQuizWord()">❯</button>
 </div>

 <script>
 // --- МЕНЮ ---
 function toggleMenu() {
 document.getElementById('settingsMenu').classList.toggle('open');
 }
 document.addEventListener('click', function(event) {
 const menu = document.getElementById('settingsMenu');
 if (!menu.contains(event.target)) menu.classList.remove('open');
 });

 // БАЗА ДАННЫХ
 const allColors = [
 { name: "PUMPKIN", img: "pumpkin.png" },
 { name: "COFFIN", img: "coffin.png" },
 { name: "MONSTER", img: "monster.png" },
 { name: "WEREWOLF", img: "werewolf.png" },
 { name: "POTION", img: "potion.png" },
 { name: "WITCH", img: "witch.png" },
 { name: "ZOMBIE", img: "zombie.png" },
 { name: "BAT", img: "bat.png" },
 { name: "OWL", img: "owl.png" },
 { name: "SPIDER", img: "spider.png" },
 { name: "GHOST", img: "ghost.png" },
 { name: "VAMPIRE", img: "vampire.png" }
 ];

 let selectedColors = [];
 let currentLevel = 2;
 let currentLetterMode = 'sequential';
 let currentNumberMode = '1';
 let currentQuizLevel = 2;
 
 let fcIndex = 0;
 let cardsData = [];
 let hasFlippedCard = false;
 let lockBoard = false;
 let firstCard, secondCard;
 let matchedPairs = 0;
 let fasterRunning = false;
 let fasterPaused = false;
 let fasterSequence = [];
 
 let builderIndex = 0;
 let currentBuilderWord = "";
 
 let missingRunning = false;
 let missingPaused = false;
 
 let quizIndex = 0;
 let currentQuizWord = "";
 let currentQuizInputIndex = -1;

 window.onload = function() {
 renderCheckboxes();
 for(let i=0; i<4; i++) document.getElementById('color-chk-'+i).checked = true;
 
 applySettings();
 document.addEventListener('keydown', handleQuizInput);
 };

 function renderCheckboxes() {
 const container = document.getElementById('color-checkboxes');
 allColors.forEach((color, index) => {
 const label = document.createElement('label');
 label.innerHTML = `<input type="checkbox" id="color-chk-${index}" value="${index}" onchange="applySettings()"> ${color.name}`;
 container.appendChild(label);
 });
 }

 function selectAllColors() { document.querySelectorAll('#color-checkboxes input').forEach(cb => cb.checked = true); applySettings(); }
 function deselectAllColors() { document.querySelectorAll('#color-checkboxes input').forEach(cb => cb.checked = false); applySettings(); }

 function applySettings() {
 selectedColors = [];
 const checkboxes = document.querySelectorAll('#color-checkboxes input[type="checkbox"]:checked');
 
 if(checkboxes.length === 0) {
 document.getElementById('fc-text').innerText = "Select words";
 document.getElementById('fc-img').src = "";
 document.getElementById('game-board').innerHTML = "";
 document.getElementById('listen-board').innerHTML = "";
 document.getElementById('builder-slots').innerHTML = "";
 document.getElementById('builder-letters').innerHTML = "";
 document.getElementById('quiz-slots').innerHTML = "";
 return;
 }

 checkboxes.forEach(cb => selectedColors.push(allColors[cb.value]));
 currentLevel = parseInt(document.getElementById('difficulty-level').value);
 currentLetterMode = document.getElementById('letter-mode').value;
 currentNumberMode = document.getElementById('card-number-mode').value;
 currentQuizLevel = parseInt(document.getElementById('quiz-level').value);
 
 fcIndex = 0; builderIndex = 0; quizIndex = 0;
 
 updateFlashcard();
 startGame();
 initListenBoard();
 loadBuilderWord(0);
 loadQuizWord(0);
 
 if (fasterRunning) stopFasterGame();
 if (missingRunning) stopMissingGame();
 }

 function switchTab(tabNum) {
 for(let i=1; i<=7; i++) {
 let el = document.getElementById('tab'+i+'-content');
 if(el) el.style.display = 'none';
 }
 document.getElementById('tab'+tabNum+'-content').style.display = 'flex';
 
 const btns = document.querySelectorAll('.tab-btn');
 btns.forEach((btn, i) => btn.classList.toggle('active', i === tabNum - 1));

 if (tabNum !== 4 && fasterRunning) stopFasterGame();
 if (tabNum !== 6 && missingRunning) stopMissingGame();
 if(tabNum === 7) document.getElementById('hidden-input').focus();
 }

 function shuffle(array) {
 let currentIndex = array.length, randomIndex;
 let tempArray = [...array]; 
 while (currentIndex !== 0) {
 randomIndex = Math.floor(Math.random() * currentIndex);
 currentIndex--;
 [tempArray[currentIndex], tempArray[randomIndex]] = [tempArray[randomIndex], tempArray[currentIndex]];
 }
 return tempArray;
 }

 // --- TAB 1 ---
 function updateFlashcard() {
 if(selectedColors.length === 0) return;
 const currentColor = selectedColors[fcIndex];
 document.getElementById('fc-img').src = currentColor.img;
 document.getElementById('fc-text').innerText = currentColor.name;
 }
 function nextFlashcard() { if(selectedColors.length === 0) return; fcIndex = (fcIndex + 1) % selectedColors.length; updateFlashcard(); }
 function prevFlashcard() { if(selectedColors.length === 0) return; fcIndex--; if(fcIndex < 0) fcIndex = selectedColors.length - 1; updateFlashcard(); }

 // --- TAB 2 ---
 function startGame() {
 const board = document.getElementById('game-board');
 board.innerHTML = ''; cardsData = []; matchedPairs = 0; hasFlippedCard = false; lockBoard = false;
 document.getElementById('win-message').style.display = 'none';
 document.getElementById('restart-btn').style.display = 'none';
 if (selectedColors.length === 0) return;

 selectedColors.forEach(color => {
 if (currentLevel === 1) {
 cardsData.push({ type: 'img', value: color.name, img: color.img });
 cardsData.push({ type: 'img', value: color.name, img: color.img });
 } else if (currentLevel === 2) {
 cardsData.push({ type: 'img', value: color.name, img: color.img });
 cardsData.push({ type: 'text', value: color.name });
 } else {
 cardsData.push({ type: 'text', value: color.name });
 cardsData.push({ type: 'text', value: color.name });
 }
 });

 let cardNumbers = [];
 if (currentNumberMode === 'random') {
 let pool = []; for(let i=12; i<=50; i++) pool.push(i);
 pool = shuffle(pool); cardNumbers = pool.slice(0, cardsData.length);
 }

 shuffle(cardsData).forEach((cardInfo, index) => {
 const card = document.createElement('div');
 card.classList.add('card'); card.dataset.value = cardInfo.value;
 let backContent = cardInfo.type === 'text' ? cardInfo.value : `<img src="${cardInfo.img}" class="card-img-game" alt="img">`;
 let frontNumber = index + 1;
 if (currentNumberMode === '12') frontNumber = index + 12;
 if (currentNumberMode === 'random') frontNumber = cardNumbers[index];
 card.innerHTML = `<div class="card-inner"><div class="card-front">${frontNumber}</div><div class="card-back">${backContent}</div></div>`;
 card.addEventListener('click', flipCard); board.appendChild(card);
 });
 }
 function flipCard() {
 if (lockBoard || this === firstCard) return;
 this.classList.add('flipped');
 if (!hasFlippedCard) { hasFlippedCard = true; firstCard = this; return; }
 secondCard = this; checkForMatch();
 }
 function checkForMatch() {
 let isMatch = firstCard.dataset.value === secondCard.dataset.value;
 if (isMatch) disableCards(); else unflipCards();
 }
 function disableCards() {
 firstCard.removeEventListener('click', flipCard); secondCard.removeEventListener('click', flipCard);
 matchedPairs++;
 if (matchedPairs === selectedColors.length) {
 setTimeout(() => {
 document.getElementById('win-message').style.display = 'block';
 document.getElementById('restart-btn').style.display = 'inline-block';
 }, 500);
 }
 resetBoard();
 }
 function unflipCards() {
 lockBoard = true;
 setTimeout(() => {
 firstCard.classList.remove('flipped'); secondCard.classList.remove('flipped');
 resetBoard();
 }, 1000);
 }
 function resetBoard() { [hasFlippedCard, lockBoard] = [false, false]; [firstCard, secondCard] = [null, null]; }

 // --- TAB 3 ---
 function initListenBoard() {
 const board = document.getElementById('listen-board');
 board.innerHTML = '';
 if (selectedColors.length === 0) return;

 let displayColors = shuffle(selectedColors);
 let letters = [];
 const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 
 if (currentLetterMode === 'sequential') {
 for (let i = 0; i < displayColors.length; i++) letters.push(alphabet[i % 26]);
 } else {
 let availableLetters = shuffle(alphabet.split(''));
 for (let i = 0; i < displayColors.length; i++) letters.push(availableLetters[i % 26]);
 letters = shuffle(letters); 
 }

 displayColors.forEach((color, index) => {
 const card = document.createElement('div'); card.classList.add('listen-card');
 let content = '';
 if (currentLevel === 1) content = `<div class="listen-img-box"><img src="${color.img}" class="listen-img"></div>`;
 else if (currentLevel === 2) content = `<div class="listen-img-box"><img src="${color.img}" class="listen-img"><div class="listen-text">${color.name}</div></div>`;
 else content = `<div class="listen-img-box"><div class="listen-text" style="font-size: 36px;">${color.name}</div></div>`;

 card.innerHTML = `<div class="listen-letter">${letters[index]}</div>${content}`;
 board.appendChild(card);
 });
 }

 // --- TAB 4 ---
 async function sleep(ms) {
 const start = Date.now();
 while (Date.now() - start < ms) {
 if (!fasterPaused) await new Promise(r => setTimeout(r, 50));
 else await new Promise(r => setTimeout(r, 100));
 }
 while (fasterPaused && fasterRunning) await new Promise(r => setTimeout(r, 100));
 }

 async function startFasterGame() {
 if (fasterRunning) { stopFasterGame(); return; }
 if (selectedColors.length === 0) { alert("Select words first!"); return; }

 fasterRunning = true; fasterPaused = false; fasterSequence = shuffle(selectedColors);
 const startBtn = document.getElementById('faster-start-btn');
 startBtn.innerText = 'Stop'; startBtn.style.backgroundColor = '#c9344b';
 document.getElementById('faster-pause-btn').disabled = false; document.getElementById('faster-pause-btn').innerText = 'Pause';
 const display = document.getElementById('faster-display');

 for (let i = 0; i < fasterSequence.length; i++) {
 if (!fasterRunning) break;
 for (let j = 3; j > 0; j--) {
 if (!fasterRunning) break;
 display.innerHTML = `<h1 style="font-size: 150px; margin: 0; color: #e94560;">${j}</h1>`;
 await sleep(1000);
 }
 if (!fasterRunning) break;

 const currentColor = fasterSequence[i];
 let cardHTML = '';
 if (currentLevel === 1) cardHTML = `<img src="${currentColor.img}" class="faster-img">`;
 else if (currentLevel === 2) cardHTML = `<img src="${currentColor.img}" class="faster-img"><div style="font-size: 60px; font-weight: bold; color: #16213e; margin-top: 10px;">${currentColor.name}</div>`;
 else cardHTML = `<div style="font-size: 90px; font-weight: bold; color: #16213e;">${currentColor.name}</div>`;
 
 display.innerHTML = cardHTML;
 await sleep(3000);
 if (!fasterRunning) break;
 if (i < fasterSequence.length - 1) {
 display.innerHTML = `<h1 style="font-size: 60px; margin: 0; color: #e94560;">Are you ready?</h1>`;
 await sleep(3000);
 if (!fasterRunning) break;
 }
 }

 if (fasterRunning) {
 fasterRunning = false;
 display.innerHTML = `<h1 style="font-size: 80px; margin: 0; color: #e94560;">Well done!</h1>`;
 startBtn.innerText = 'Start Again'; startBtn.style.backgroundColor = '#e94560';
 document.getElementById('faster-pause-btn').disabled = true;
 }
 }
 function stopFasterGame() {
 fasterRunning = false; fasterPaused = false;
 const startBtn = document.getElementById('faster-start-btn');
 startBtn.innerText = 'Start'; startBtn.style.backgroundColor = '#e94560';
 document.getElementById('faster-pause-btn').disabled = true; document.getElementById('faster-pause-btn').innerText = 'Pause';
 document.getElementById('faster-display').innerHTML = '<h1 style="color: #bdc3c7;">Press Start</h1>';
 }
 function togglePauseFasterGame() {
 if (!fasterRunning) return;
 fasterPaused = !fasterPaused;
 document.getElementById('faster-pause-btn').innerText = fasterPaused ? 'Resume' : 'Pause';
 }

 // --- TAB 5 (WORD BUILDER) - БЕЗ ИЗМЕНЕНИЙ ---
 function loadBuilderWord(index) {
 if (selectedColors.length === 0) return;
 if (index >= selectedColors.length) builderIndex = 0;
 else if (index < 0) builderIndex = selectedColors.length - 1;
 else builderIndex = index;

 const wordObj = selectedColors[builderIndex];
 currentBuilderWord = wordObj.name;
 
 document.getElementById('builder-checkmark').style.display = 'none';
 document.getElementById('builder-image').src = wordObj.img;
 
 const slotsContainer = document.getElementById('builder-slots');
 const poolContainer = document.getElementById('builder-letters');
 slotsContainer.innerHTML = ''; poolContainer.innerHTML = '';

 for (let i = 0; i < currentBuilderWord.length; i++) {
 const char = currentBuilderWord[i];
 const slot = document.createElement('div');
 if (char === " ") slot.classList.add('slot', 'space');
 else { slot.classList.add('slot'); slot.dataset.index = i; }
 slotsContainer.appendChild(slot);
 }

 let lettersToScramble = currentBuilderWord.replace(/ /g, "").split("");
 lettersToScramble = shuffle(lettersToScramble);

 lettersToScramble.forEach(char => {
 const btn = document.createElement('button');
 btn.classList.add('letter-btn'); btn.innerText = char;
 btn.onclick = () => handleBuilderClick(btn, char);
 poolContainer.appendChild(btn);
 });
 }
 function handleBuilderClick(btn, char) {
 const slots = document.querySelectorAll('#builder-slots .slot:not(.space)');
 let targetSlot = null; let targetIndex = -1;

 for (let i = 0; i < slots.length; i++) {
 if (!slots[i].classList.contains('filled')) {
 targetSlot = slots[i]; targetIndex = parseInt(slots[i].dataset.index); break;
 }
 }
 if (!targetSlot) return;

 const expectedChar = currentBuilderWord[targetIndex];

 if (char === expectedChar) {
 btn.classList.add('correct');
 setTimeout(() => btn.classList.add('hidden'), 300);
 targetSlot.innerText = char; targetSlot.classList.add('filled');
 checkBuilderWin();
 } else {
 btn.classList.add('wrong');
 setTimeout(() => btn.classList.remove('wrong'), 500);
 }
 }
 function checkBuilderWin() {
 const slots = document.querySelectorAll('#builder-slots .slot:not(.space)');
 let allFilled = true;
 slots.forEach(slot => { if (!slot.classList.contains('filled')) allFilled = false; });
 if (allFilled) document.getElementById('builder-checkmark').style.display = 'block';
 }
 function nextBuilderWord() { loadBuilderWord(builderIndex + 1); }
 function prevBuilderWord() { loadBuilderWord(builderIndex - 1); }

 // --- TAB 6 (WHAT'S MISSING) - БЕЗ ИЗМЕНЕНИЙ ---
 async function missingSleep(ms) {
 const start = Date.now();
 while (Date.now() - start < ms) {
 if (!missingPaused) await new Promise(r => setTimeout(r, 50));
 else await new Promise(r => setTimeout(r, 100));
 }
 while (missingPaused && missingRunning) await new Promise(r => setTimeout(r, 100));
 }

 async function startMissingGame() {
 if (missingRunning || selectedColors.length < 2) {
 if(selectedColors.length < 2) alert("Select at least 2 words!");
 return;
 }
 missingRunning = true;
 missingPaused = false;
 const display = document.getElementById('missing-display');
 const startBtn = document.getElementById('missing-start-btn');
 const pauseBtn = document.getElementById('missing-pause-btn');
 
 startBtn.disabled = true;
 pauseBtn.disabled = false;
 pauseBtn.innerText = ' ';

 let roundCards = shuffle(selectedColors);
 let missingIndex = Math.floor(Math.random() * roundCards.length);

 for (let i = 3; i > 0; i--) {
 if(!missingRunning) return;
 display.innerHTML = `<h1 class="countdown-text">${i}</h1>`;
 await missingSleep(1000);
 }

 const showTime = (3 + roundCards.length) * 1000;
 display.innerHTML = `<div class="missing-grid" id="missing-grid"></div>`;
 const grid = document.getElementById('missing-grid');
 
 roundCards.forEach(color => {
 const card = document.createElement('div');
 card.classList.add('missing-card');
 card.innerHTML = `<img src="${color.img}"><span>${color.name}</span>`;
 grid.appendChild(card);
 });

 await missingSleep(showTime);
 if(!missingRunning) return;

 display.innerHTML = `<h1 class="question-text">What's missing?</h1>`;
 await missingSleep(1000);
 if(!missingRunning) return;

 let newOrder = shuffle(roundCards);
 display.innerHTML = `<div class="missing-grid" id="missing-grid"></div>`;
 const newGrid = document.getElementById('missing-grid');
 let missingCardDOM = null;

 newOrder.forEach((color) => {
 const card = document.createElement('div');
 card.classList.add('missing-card');
 if (color.name === roundCards[missingIndex].name) {
 card.classList.add('hidden-card'); card.innerHTML = '?'; missingCardDOM = card;
 } else {
 card.innerHTML = `<img src="${color.img}"><span>${color.name}</span>`;
 }
 newGrid.appendChild(card);
 });

 await missingSleep(3000);
 if(!missingRunning) return;
 
 missingCardDOM.classList.remove('hidden-card');
 missingCardDOM.classList.add('revealed');
 missingCardDOM.innerHTML = `<img src="${roundCards[missingIndex].img}"><span>${roundCards[missingIndex].name}</span>`;

 missingRunning = false;
 startBtn.disabled = false;
 startBtn.innerText = 'Next';
 pauseBtn.disabled = true;
 }

 function togglePauseMissingGame() {
 if(!missingRunning) return;
 missingPaused = !missingPaused;
 document.getElementById('missing-pause-btn').innerText = missingPaused ? ' ' : ' ';
 }

 function stopMissingGame() {
 missingRunning = false;
 missingPaused = false;
 document.getElementById('missing-start-btn').disabled = false;
 document.getElementById('missing-start-btn').innerText = 'Start';
 document.getElementById('missing-pause-btn').disabled = true;
 document.getElementById('missing-pause-btn').innerText = ' ';
 document.getElementById('missing-display').innerHTML = '<h1 style="color: #bdc3c7;">Press Start</h1>';
 }

 // --- TAB 7 (QUIZ) ---
 function loadQuizWord(index) {
 if (selectedColors.length === 0) return;
 if (index >= selectedColors.length) quizIndex = 0;
 else if (index < 0) quizIndex = selectedColors.length - 1;
 else quizIndex = index;

 const wordObj = selectedColors[quizIndex];
 currentQuizWord = wordObj.name;
 
 document.getElementById('quiz-image').src = wordObj.img;
 
 const slotsContainer = document.getElementById('quiz-slots');
 slotsContainer.innerHTML = '';
 currentQuizInputIndex = -1;

 const vowels = ['A', 'E', 'I', 'O', 'U'];

 for (let i = 0; i < currentQuizWord.length; i++) {
 const char = currentQuizWord[i];
 let hide = false;

 if (char !== " ") {
 if (currentQuizLevel === 1) {
 if (vowels.includes(char)) hide = true;
 } else if (currentQuizLevel === 2) {
 if (vowels.includes(char) || Math.random() < 0.3) hide = true;
 } else {
 hide = true;
 }
 }

 const slot = document.createElement('div');
 if (char === " ") {
 slot.classList.add('quiz-slot', 'space');
 } else if (hide) {
 slot.classList.add('quiz-slot');
 slot.dataset.index = i;
 slot.dataset.letter = char;
 } else {
 slot.classList.add('quiz-slot', 'correct');
 slot.innerText = char;
 }
 slotsContainer.appendChild(slot);
 }
 
 highlightNextQuizSlot();
 }

 function highlightNextQuizSlot() {
 document.querySelectorAll('.quiz-slot.active').forEach(el => el.classList.remove('active'));
 const emptySlots = document.querySelectorAll('.quiz-slot:not(.correct):not(.space)');
 if (emptySlots.length > 0) {
 emptySlots[0].classList.add('active');
 currentQuizInputIndex = parseInt(emptySlots[0].dataset.index);
 } else {
 currentQuizInputIndex = -1;
 }
 }

 function handleQuizInput(e) {
 if (document.getElementById('tab7-content').style.display !== 'flex') return;
 if (currentQuizInputIndex === -1) return;
 if (e.key.length === 1 && e.key.match(/[a-z]/i)) {
 const letter = e.key.toUpperCase();
 const activeSlot = document.querySelector('.quiz-slot.active');
 const expectedLetter = currentQuizWord[currentQuizInputIndex];

 if (letter === expectedLetter) {
 activeSlot.innerText = letter;
 activeSlot.classList.remove('active');
 activeSlot.classList.add('correct');
 setTimeout(highlightNextQuizSlot, 100);
 } else {
 activeSlot.classList.add('wrong');
 setTimeout(() => {
 activeSlot.innerText = '';
 activeSlot.classList.remove('wrong');
 }, 500);
 }
 }
 }

 function nextQuizWord() { loadQuizWord(quizIndex + 1); }
 function prevQuizWord() { loadQuizWord(quizIndex - 1); }

 </script>
