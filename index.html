<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>English Game</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 background-color: #1a1a2e;
 color: white;
 margin: 0;
 padding: 0;
 padding-top: 60px;
 text-align: center;
 }
 
 /* --- HOVER / TOUCH SETTINGS PANEL --- */
 .hover-menu {
 position: fixed;
 top: 0;
 left: 50%;
 transform: translateX(-50%);
 width: 100%;
 max-width: 900px;
 background-color: #16213e;
 border-bottom-left-radius: 15px;
 border-bottom-right-radius: 15px;
 box-shadow: 0 10px 25px rgba(0,0,0,0.8);
 z-index: 1000;
 transition: all 0.3s ease;
 }
 .hover-trigger {
 padding: 15px;
 text-align: center;
 font-weight: bold;
 font-size: 16px;
 cursor: pointer;
 color: #e94560;
 transition: color 0.3s, background-color 0.3s;
 border-bottom-left-radius: 15px;
 border-bottom-right-radius: 15px;
 }
 .hover-menu:hover .hover-trigger,
 .hover-menu.open .hover-trigger {
 color: white;
 background-color: #e94560;
 }
 
 .hover-content {
 max-height: 0;
 overflow: hidden;
 transition: max-height 0.4s ease-out;
 padding: 0 20px;
 }
 
 .hover-menu:hover .hover-content,
 .hover-menu.open .hover-content {
 max-height: 450px;
 padding: 0 20px 20px 20px;
 overflow: visible;
 }
 
 .settings-panel {
 display: flex;
 justify-content: space-around;
 gap: 15px;
 align-items: flex-start;
 margin-top: 10px;
 }
 .color-list {
 display: grid;
 grid-template-columns: repeat(3, 1fr);
 gap: 10px;
 text-align: left;
 font-size: 16px;
 margin-bottom: 10px;
 }
 .color-list label {
 cursor: pointer;
 display: flex;
 align-items: center;
 gap: 5px;
 }
 .select-btns {
 display: flex;
 gap: 10px;
 }
 .select-btns button {
 padding: 5px 10px;
 font-size: 14px;
 cursor: pointer;
 background-color: #e94560;
 color: white;
 border: none;
 border-radius: 5px;
 font-weight: bold;
 }
 .select-btns button:hover { background-color: #c9344b; }
 
 .dropdown-group {
 display: flex;
 flex-direction: column;
 gap: 15px;
 text-align: left;
 font-size: 14px;
 }
 .dropdown-group label {
 display: block;
 margin-bottom: 5px;
 font-weight: bold;
 }
 select {
 width: 100%;
 padding: 5px;
 font-size: 14px;
 border-radius: 5px;
 }
 
 /* --- TABS --- */
 .tabs {
 margin-top: 20px;
 margin-bottom: 20px;
 }
 .tab-btn {
 padding: 10px 20px;
 font-size: 18px;
 cursor: pointer;
 background-color: #533483;
 color: white;
 border: none;
 border-radius: 5px;
 margin: 0 5px;
 font-weight: bold;
 transition: 0.3s;
 }
 .tab-btn.active {
 background-color: #e94560;
 }
 
 /* --- TAB 1 (LEARN) --- */
 #tab1-content {
 display: none;
 flex-direction: column;
 align-items: center;
 }
 .flashcard {
 background-color: #f5f5f5;
 padding: 15px;
 border-radius: 20px;
 width: 450px; 
 height: 520px;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 box-shadow: 0 10px 25px rgba(0,0,0,0.6);
 }
 
 .flashcard-img {
 width: 100%;
 height: 80%; 
 object-fit: contain; 
 margin-bottom: 15px;
 }
 
 .flashcard-text {
 font-size: 50px;
 font-weight: bold;
 color: #16213e;
 text-transform: uppercase;
 }
 .nav-buttons {
 display: flex;
 gap: 20px;
 margin-top: 20px;
 }
 .nav-buttons button {
 padding: 15px 30px;
 font-size: 20px;
 background-color: #e94560;
 color: white;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 font-weight: bold;
 transition: 0.2s;
 }
 .nav-buttons button:hover { background-color: #c9344b; }

 /* --- TAB 2 (PAIRS) --- */
 #tab2-content {
 display: none;
 }
 .game-board {
 display: grid;
 grid-template-columns: repeat(auto-fit, 160px);
 gap: 15px;
 justify-content: center; 
 max-width: 1000px;
 margin: 0 auto;
 }
 .card {
 width: 160px;
 height: 160px;
 perspective: 1000px;
 cursor: pointer;
 }
 .card-inner {
 width: 100%;
 height: 100%;
 position: relative;
 transition: transform 0.6s;
 transform-style: preserve-3d;
 }
 .card.flipped .card-inner { transform: rotateY(180deg); }
 
 .card-front, .card-back {
 width: 100%;
 height: 100%;
 position: absolute;
 backface-visibility: hidden;
 border-radius: 15px;
 display: flex;
 align-items: center;
 justify-content: center;
 font-weight: bold;
 box-sizing: border-box; /* Чтобы рамки не меняли размер */
 }
 
 /* ЯРКАЯ РАМКА ДЛЯ РУБАШКИ */
 .card-front {
 background-color: #533483;
 color: white;
 font-size: 45px;
 text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
 border: 4px solid #e94560; /* Оранжево-красная рамка */
 box-shadow: 0 6px 12px rgba(0,0,0,0.6), inset 0 0 15px rgba(0,0,0,0.4); /* Внешняя и внутренняя тень */
 }
 
 /* РАМКА ДЛЯ ЛИЦЕВОЙ СТОРОНЫ */
 .card-back {
 background-color: white;
 color: #16213e;
 transform: rotateY(180deg);
 font-size: 22px;
 flex-direction: column;
 text-transform: uppercase;
 padding: 10px;
 overflow: hidden; 
 border: 4px solid #e94560; /* Такая же рамка для лица */
 }
 
 .card-img-game {
 width: 100%;
 height: 100%;
 object-fit: contain; 
 }
 
 .win-message {
 display: none;
 font-size: 36px;
 color: #e94560;
 margin-top: 20px;
 font-weight: bold;
 text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
 }
 .restart-btn {
 display: none; 
 margin-top: 20px; 
 padding: 15px 30px;
 font-size: 20px;
 background-color: #e94560;
 color: white;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 font-weight: bold;
 }
 .restart-btn:hover { background-color: #c9344b; }

 /* --- TAB 3 (LISTEN & CHOOSE) --- */
 #tab3-content {
 display: none;
 flex-direction: column;
 align-items: center;
 }
 .listen-board {
 display: grid;
 grid-template-columns: repeat(auto-fit, 220px);
 gap: 20px;
 justify-content: center;
 max-width: 1000px;
 margin: 0 auto 30px auto;
 }
 .listen-card {
 background-color: white;
 border-radius: 15px;
 height: 260px;
 display: flex;
 flex-direction: column;
 box-shadow: 0 5px 15px rgba(0,0,0,0.5);
 overflow: hidden;
 position: relative;
 border: 4px solid #533483; /* Рамка для красоты */
 box-sizing: border-box;
 }
 .listen-letter {
 position: absolute;
 top: 8px;
 left: 10px;
 background-color: #16213e;
 color: white;
 font-size: 32px;
 font-weight: bold;
 padding: 4px 16px;
 border-radius: 8px;
 z-index: 10;
 }
 .listen-img-box {
 flex-grow: 1;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 padding: 10px; 
 height: 100%;
 box-sizing: border-box;
 }
 
 .listen-img {
 width: 100%;
 height: 100%;
 object-fit: contain; 
 }
 
 .listen-text {
 font-size: 24px;
 font-weight: bold;
 color: #16213e;
 margin-top: 5px;
 margin-bottom: 5px;
 text-transform: uppercase;
 }
 .shuffle-btn {
 padding: 15px 40px;
 font-size: 24px;
 background-color: #533483;
 color: white;
 border: none;
 border-radius: 8px;
 cursor: pointer;
 font-weight: bold;
 box-shadow: 0 4px 8px rgba(0,0,0,0.4);
 transition: 0.2s;
 }
 .shuffle-btn:hover { background-color: #3e2562; }

 /* --- TAB 4 (WHO IS FASTER) --- */
 #tab4-content {
 display: none;
 flex-direction: column;
 align-items: center;
 }
 .faster-display {
 background-color: #16213e;
 border-radius: 15px;
 width: 100%;
 max-width: 650px;
 height: 500px;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 margin: 0 auto 20px auto;
 box-shadow: 0 10px 20px rgba(0,0,0,0.7);
 overflow: hidden;
 border: 4px solid #533483;
 }
 
 .faster-img {
 width: 300px;
 height: 300px;
 object-fit: contain;
 border-radius: 15px;
 }
 
 .faster-controls button {
 padding: 15px 30px;
 font-size: 20px;
 margin: 0 10px;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 font-weight: bold;
 color: white;
 }
 .btn-start { background-color: #e94560; }
 .btn-start:hover { background-color: #c9344b; }
 .btn-pause { background-color: #533483; }
 .btn-pause:hover { background-color: #3e2562; }
 .btn-pause:disabled { background-color: #7f8c8d; cursor: not-allowed; }
 </style>
</head>
<body>

 <div class="hover-menu" id="settingsMenu">
 <div class="hover-trigger" onclick="toggleMenu()">Tap / Hover for settings ⬇</div>
 <div class="hover-content" onclick="event.stopPropagation()">
 <div class="settings-panel">
 <div>
 <strong>1. Select words:</strong>
 <div class="color-list" id="color-checkboxes"></div>
 <div class="select-btns">
 <button onclick="selectAllColors()">Select All</button>
 <button onclick="deselectAllColors()">Clear All</button>
 </div>
 </div>
 <div class="dropdown-group">
 <div>
 <label>2. Difficulty (All Tabs):</label>
 <select id="difficulty-level" onchange="applySettings()">
 <option value="1">Level 1 (Picture)</option>
 <option value="2" selected>Level 2 (Picture + Word)</option>
 <option value="3">Level 3 (Word)</option>
 </select>
 </div>
 <div>
 <label>3. Letters for Tab 3:</label>
 <select id="letter-mode" onchange="applySettings()">
 <option value="sequential">Sequential (A, B, C...)</option>
 <option value="random">Random (Z, Y, H...)</option>
 </select>
 </div>
 <div>
 <label>4. Numbers for Pairs (Tab 2):</label>
 <select id="card-number-mode" onchange="applySettings()">
 <option value="1">Start from 1</option>
 <option value="12">Start from 12</option>
 <option value="random">Random (12+)</option>
 </select>
 </div>
 </div>
 </div>
 </div>
 </div>

 <div class="tabs">
 <button class="tab-btn active" onclick="switchTab(1)">Tab 1: Learn</button>
 <button class="tab-btn" onclick="switchTab(2)">Tab 2: Pairs</button>
 <button class="tab-btn" onclick="switchTab(3)">Tab 3: Listen & Choose</button>
 <button class="tab-btn" onclick="switchTab(4)">Tab 4: Who is faster?</button>
 </div>

 <div id="tab1-content">
 <div class="flashcard" id="flashcard">
 <img id="fc-img" class="flashcard-img" src="" alt="">
 <div class="flashcard-text" id="fc-text"></div>
 </div>
 <div class="nav-buttons">
 <button onclick="prevFlashcard()">Previous</button>
 <button onclick="nextFlashcard()">Next</button>
 </div>
 </div>

 <div id="tab2-content">
 <div class="game-board" id="game-board"></div>
 <div class="win-message" id="win-message"> Great job! You found all the pairs! </div>
 <button class="restart-btn" id="restart-btn" onclick="startGame()">Play Again</button>
 </div>

 <div id="tab3-content">
 <div class="listen-board" id="listen-board"></div>
 <button class="shuffle-btn" onclick="initListenBoard()">Shuffle</button>
 </div>

 <div id="tab4-content">
 <div class="faster-display" id="faster-display">
 <h1 style="color: #bdc3c7;">Press Start</h1>
 </div>
 <div class="faster-controls">
 <button id="faster-start-btn" class="btn-start" onclick="startFasterGame()">Start</button>
 <button id="faster-pause-btn" class="btn-pause" onclick="togglePauseFasterGame()" disabled>Pause</button>
 </div>
 </div>

 <script>
 function toggleMenu() {
 document.getElementById('settingsMenu').classList.toggle('open');
 }
 document.addEventListener('click', function(event) {
 const menu = document.getElementById('settingsMenu');
 if (!menu.contains(event.target)) {
 menu.classList.remove('open');
 }
 });

 const allColors = [
 { name: "PUMPKIN", img: "pumpkin.png" },
 { name: "COFFIN", img: "coffin.png" },
 { name: "MONSTER", img: "monster.png" },
 { name: "WEREWOLF", img: "werewolf.png" },
 { name: "POTION", img: "potion.png" },
 { name: "WITCH", img: "witch.png" },
 { name: "ZOMBIE", img: "zombie.png" },
 { name: "BAT", img: "bat.png" },
 { name: "OWL", img: "owl.png" },
 { name: "SPIDER", img: "spider.png" },
 { name: "GHOST", img: "ghost.png" },
 { name: "VAMPIRE", img: "vampire.png" }
 ];

 let selectedColors = [];
 let currentLevel = 2;
 let currentLetterMode = 'sequential';
 let currentNumberMode = '1';
 
 let fcIndex = 0;
 let cardsData = [];
 let hasFlippedCard = false;
 let lockBoard = false;
 let firstCard, secondCard;
 let matchedPairs = 0;
 let fasterRunning = false;
 let fasterPaused = false;
 let fasterSequence = [];

 window.onload = function() {
 renderCheckboxes();
 for(let i=0; i<4; i++) {
 document.getElementById('color-chk-'+i).checked = true;
 }
 applySettings();
 };

 function renderCheckboxes() {
 const container = document.getElementById('color-checkboxes');
 allColors.forEach((color, index) => {
 const label = document.createElement('label');
 label.innerHTML = `<input type="checkbox" id="color-chk-${index}" value="${index}" onchange="applySettings()"> ${color.name}`;
 container.appendChild(label);
 });
 }

 function selectAllColors() {
 document.querySelectorAll('#color-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = true);
 applySettings();
 }

 function deselectAllColors() {
 document.querySelectorAll('#color-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
 applySettings();
 }

 function applySettings() {
 selectedColors = [];
 const checkboxes = document.querySelectorAll('#color-checkboxes input[type="checkbox"]:checked');
 
 if(checkboxes.length === 0) {
 document.getElementById('fc-text').innerText = "Select words";
 document.getElementById('fc-img').src = "";
 document.getElementById('game-board').innerHTML = "";
 document.getElementById('listen-board').innerHTML = "";
 return;
 }

 checkboxes.forEach(cb => {
 selectedColors.push(allColors[cb.value]);
 });

 currentLevel = parseInt(document.getElementById('difficulty-level').value);
 currentLetterMode = document.getElementById('letter-mode').value;
 currentNumberMode = document.getElementById('card-number-mode').value;
 
 fcIndex = 0;
 updateFlashcard();
 startGame();
 initListenBoard();
 
 if (fasterRunning) stopFasterGame();
 }

 function switchTab(tabNum) {
 for(let i=1; i<=4; i++) {
 document.getElementById('tab'+i+'-content').style.display = 'none';
 }
 document.getElementById('tab'+tabNum+'-content').style.display = (tabNum === 2) ? 'block' : 'flex';
 
 const btns = document.querySelectorAll('.tab-btn');
 btns.forEach((btn, i) => btn.classList.toggle('active', i === tabNum - 1));

 if (tabNum !== 4 && fasterRunning) {
 stopFasterGame();
 }
 }

 function shuffle(array) {
 let currentIndex = array.length, randomIndex;
 let tempArray = [...array]; 
 while (currentIndex !== 0) {
 randomIndex = Math.floor(Math.random() * currentIndex);
 currentIndex--;
 [tempArray[currentIndex], tempArray[randomIndex]] = [tempArray[randomIndex], tempArray[currentIndex]];
 }
 return tempArray;
 }

 function updateFlashcard() {
 if(selectedColors.length === 0) return;
 const currentColor = selectedColors[fcIndex];
 document.getElementById('fc-img').src = currentColor.img;
 document.getElementById('fc-text').innerText = currentColor.name;
 }

 function nextFlashcard() {
 if(selectedColors.length === 0) return;
 fcIndex = (fcIndex + 1) % selectedColors.length;
 updateFlashcard();
 }

 function prevFlashcard() {
 if(selectedColors.length === 0) return;
 fcIndex--;
 if(fcIndex < 0) fcIndex = selectedColors.length - 1;
 updateFlashcard();
 }

 function startGame() {
 const board = document.getElementById('game-board');
 board.innerHTML = '';
 cardsData = [];
 matchedPairs = 0;
 hasFlippedCard = false;
 lockBoard = false;
 document.getElementById('win-message').style.display = 'none';
 document.getElementById('restart-btn').style.display = 'none';

 if (selectedColors.length === 0) return;

 selectedColors.forEach(color => {
 if (currentLevel === 1) {
 cardsData.push({ type: 'img', value: color.name, img: color.img });
 cardsData.push({ type: 'img', value: color.name, img: color.img });
 } else if (currentLevel === 2) {
 cardsData.push({ type: 'img', value: color.name, img: color.img });
 cardsData.push({ type: 'text', value: color.name });
 } else if (currentLevel === 3) {
 cardsData.push({ type: 'text', value: color.name });
 cardsData.push({ type: 'text', value: color.name });
 }
 });

 let cardNumbers = [];
 if (currentNumberMode === 'random') {
 let pool = [];
 for(let i=12; i<=50; i++) pool.push(i);
 pool = shuffle(pool);
 cardNumbers = pool.slice(0, cardsData.length);
 }

 shuffle(cardsData).forEach((cardInfo, index) => {
 const card = document.createElement('div');
 card.classList.add('card');
 card.dataset.value = cardInfo.value;

 let backContent = cardInfo.type === 'text' ? cardInfo.value : `<img src="${cardInfo.img}" class="card-img-game" alt="img">`;

 let frontNumber = index + 1;
 if (currentNumberMode === '12') frontNumber = index + 12;
 if (currentNumberMode === 'random') frontNumber = cardNumbers[index];

 card.innerHTML = `
 <div class="card-inner">
 <div class="card-front">${frontNumber}</div>
 <div class="card-back">${backContent}</div>
 </div>
 `;

 card.addEventListener('click', flipCard);
 board.appendChild(card);
 });
 }

 function flipCard() {
 if (lockBoard || this === firstCard) return;
 this.classList.add('flipped');
 if (!hasFlippedCard) {
 hasFlippedCard = true;
 firstCard = this;
 return;
 }
 secondCard = this;
 checkForMatch();
 }

 function checkForMatch() {
 let isMatch = firstCard.dataset.value === secondCard.dataset.value;
 if (isMatch) disableCards();
 else unflipCards();
 }

 function disableCards() {
 firstCard.removeEventListener('click', flipCard);
 secondCard.removeEventListener('click', flipCard);
 matchedPairs++;
 if (matchedPairs === selectedColors.length) {
 setTimeout(() => {
 document.getElementById('win-message').style.display = 'block';
 document.getElementById('restart-btn').style.display = 'inline-block';
 }, 500);
 }
 resetBoard();
 }

 function unflipCards() {
 lockBoard = true;
 setTimeout(() => {
 firstCard.classList.remove('flipped');
 secondCard.classList.remove('flipped');
 resetBoard();
 }, 1000);
 }

 function resetBoard() {
 [hasFlippedCard, lockBoard] = [false, false];
 [firstCard, secondCard] = [null, null];
 }

 function initListenBoard() {
 const board = document.getElementById('listen-board');
 board.innerHTML = '';
 if (selectedColors.length === 0) return;

 let displayColors = shuffle(selectedColors);
 let letters = [];
 const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 
 if (currentLetterMode === 'sequential') {
 for (let i = 0; i < displayColors.length; i++) {
 letters.push(alphabet[i % 26]);
 }
 } else {
 let availableLetters = alphabet.split('');
 availableLetters = shuffle(availableLetters);
 for (let i = 0; i < displayColors.length; i++) {
 letters.push(availableLetters[i % 26]);
 }
 letters = shuffle(letters); 
 }

 displayColors.forEach((color, index) => {
 const card = document.createElement('div');
 card.classList.add('listen-card');
 
 let content = '';
 if (currentLevel === 1) {
 content = `<div class="listen-img-box"><img src="${color.img}" class="listen-img"></div>`;
 } else if (currentLevel === 2) {
 content = `<div class="listen-img-box"><img src="${color.img}" class="listen-img"><div class="listen-text">${color.name}</div></div>`;
 } else if (currentLevel === 3) {
 content = `<div class="listen-img-box"><div class="listen-text" style="font-size: 36px;">${color.name}</div></div>`;
 }

 card.innerHTML = `
 <div class="listen-letter">${letters[index]}</div>
 ${content}
 `;
 board.appendChild(card);
 });
 }

 async function sleep(ms) {
 const start = Date.now();
 while (Date.now() - start < ms) {
 if (!fasterPaused) {
 await new Promise(r => setTimeout(r, 50));
 } else {
 await new Promise(r => setTimeout(r, 100));
 }
 }
 while (fasterPaused && fasterRunning) {
 await new Promise(r => setTimeout(r, 100));
 }
 }

 async function startFasterGame() {
 if (fasterRunning) {
 stopFasterGame();
 return;
 }

 if (selectedColors.length === 0) {
 alert("Please select at least one word first!");
 return;
 }

 fasterRunning = true;
 fasterPaused = false;
 fasterSequence = shuffle(selectedColors);

 const startBtn = document.getElementById('faster-start-btn');
 startBtn.innerText = 'Stop';
 startBtn.style.backgroundColor = '#c9344b';
 document.getElementById('faster-pause-btn').disabled = false;
 document.getElementById('faster-pause-btn').innerText = 'Pause';

 const display = document.getElementById('faster-display');

 for (let i = 0; i < fasterSequence.length; i++) {
 if (!fasterRunning) break;

 for (let j = 3; j > 0; j--) {
 if (!fasterRunning) break;
 display.innerHTML = `<h1 style="font-size: 150px; margin: 0; color: #e94560;">${j}</h1>`;
 await sleep(1000);
 }
 if (!fasterRunning) break;

 const currentColor = fasterSequence[i];
 let cardHTML = '';
 
 if (currentLevel === 1) {
 cardHTML = `<img src="${currentColor.img}" class="faster-img">`;
 } else if (currentLevel === 2) {
 cardHTML = `<img src="${currentColor.img}" class="faster-img"><div style="font-size: 60px; font-weight: bold; color: #16213e; margin-top: 10px;">${currentColor.name}</div>`;
 } else if (currentLevel === 3) {
 cardHTML = `<div style="font-size: 90px; font-weight: bold; color: #16213e;">${currentColor.name}</div>`;
 }
 
 display.innerHTML = cardHTML;
 await sleep(3000);
 if (!fasterRunning) break;

 if (i < fasterSequence.length - 1) {
 display.innerHTML = `<h1 style="font-size: 60px; margin: 0; color: #e94560;">Are you ready?</h1>`;
 await sleep(3000);
 if (!fasterRunning) break;
 }
 }

 if (fasterRunning) {
 fasterRunning = false;
 display.innerHTML = `<h1 style="font-size: 80px; margin: 0; color: #e94560;">Well done!</h1>`;
 startBtn.innerText = 'Start Again';
 startBtn.style.backgroundColor = '#e94560';
 document.getElementById('faster-pause-btn').disabled = true;
 }
 }

 function stopFasterGame() {
 fasterRunning = false;
 fasterPaused = false;
 const startBtn = document.getElementById('faster-start-btn');
 startBtn.innerText = 'Start';
 startBtn.style.backgroundColor = '#e94560';
 document.getElementById('faster-pause-btn').disabled = true;
 document.getElementById('faster-pause-btn').innerText = 'Pause';
 document.getElementById('faster-display').innerHTML = '<h1 style="color: #bdc3c7;">Press Start</h1>';
 }

 function togglePauseFasterGame() {
 if (!fasterRunning) return;
 fasterPaused = !fasterPaused;
 document.getElementById('faster-pause-btn').innerText = fasterPaused ? 'Resume' : 'Pause';
 }
 </script>
</body>
</html>
